<svg width="80" height="60" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main cloud body -->
  <ellipse cx="40" cy="35" rx="25" ry="15" fill="#e5e7eb" opacity="0.9">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="scale"
      values="1;1.05;1"
      dur="2s"
      repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Left cloud puff -->
  <circle cx="20" cy="30" r="12" fill="#f3f4f6" opacity="0.8">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="scale"
      values="1;1.08;1"
      dur="2.5s"
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Right cloud puff -->
  <circle cx="60" cy="30" r="10" fill="#f3f4f6" opacity="0.8">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="scale"
      values="1;1.06;1"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Top cloud puff -->
  <circle cx="40" cy="20" r="8" fill="#ffffff" opacity="0.7">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="scale"
      values="1;1.1;1"
      dur="2.2s"
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Small floating particles -->
  <circle cx="15" cy="45" r="2" fill="#d1d5db" opacity="0.6">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="translate"
      values="0,0;2,-3;0,0"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="65" cy="45" r="1.5" fill="#d1d5db" opacity="0.5">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="translate"
      values="0,0;-1,-2;0,0"
      dur="3.5s"
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="50" r="1" fill="#e5e7eb" opacity="0.4">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="translate"
      values="0,0;1,-1;0,0"
      dur="5s"
      repeatCount="indefinite"/>
  </circle>
</svg>
